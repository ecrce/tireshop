<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Inquiry – Pros Tires Ballard</title>
  <style>
    body {
      background-color: #000;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #e60000;
    }
    form {
      display: inline-block;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      text-align: left;
      max-width: 400px;
      width: 100%;
    }
    input, textarea, button {
      width: 100%;
      background: #000;
      border: 1px solid #444;
      color: #f0f0f0;
      margin: 0.3rem 0;
      padding: 0.5rem;
      border-radius: 3px;
      font-size: 0.9rem;
    }
    button {
      background: #e60000;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    button:hover {
      filter: brightness(1.1);
    }
    .status {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 0.5rem;
    }
    a {
      color: #ff4d4d;
    }
    .back {
      margin-top: 1rem;
      display: block;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Website Inquiry</h1>
  <p>This form is for questions or feedback about the <strong>Pros Tires Ballard website</strong>.</p>

  <form id="inquiryForm" action="https://formspree.io/f/mdkwbjwg" method="POST">
    <label>
      Your email:
      <input type="email" name="email" placeholder="you@example.com" required />
    </label>
    <label>
      Message:
      <textarea name="message" placeholder="Website feedback or inquiry..." rows="4" required></textarea>
    </label>
    <button type="submit">Send</button>
    <p class="status" id="status"></p>
  </form>

  <a href="index.html" class="back">← Back to main site</a>

  <script>
    const form = document.getElementById('inquiryForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);

      const res = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        status.textContent = "Sent ✓";
        form.reset();
      } else {
        status.textContent = "Error – please try again later.";
      }
    });
  </script>
</body>
</html>
